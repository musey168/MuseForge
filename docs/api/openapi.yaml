      required: [projectId]
      properties:
        projectId:
          type: string
        repositoryId:
          type: string
        repositoryIds:
          type: array
          items: {type: string}
        baseBranch:
          type: string
          description: Existing work branch to analyze and continue directly for a single repository; empty analyzes the configured main branch before creating a new work branch
        repositoryBranches:
          type: object
          additionalProperties: {type: string}
          description: Existing work branches to analyze keyed by bound repository ID; overrides baseBranch. Empty or unlisted branches analyze each repository's configured main branch.
        title:
          type: string
        description:
          type: string
        message:
          type: string
        history:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
              content:
                type: string
    ClarifyResult:
      type: object
      required: [result, parsed, repository]
      properties:
        result:
          type: string
        parsed:
          $ref: "#/components/schemas/OpenObject"
        repository:
          $ref: "#/components/schemas/OpenObject"
    SyncConfig:
      type: object
      properties:
        playbookSeedRev:
          type: integer
        gongfengProjectId:
          type: string
        gongfengMcpUrl:
          type: string
        tapdWorkspaceId:
          type: string
        tapdIterationId:
          type: string
        tapdMcpUrl:
          type: string
        autoSyncEnabled:
          type: boolean
        autoSyncIntervalSec:
          type: integer
        lastSyncAt:
          type: string
          format: date-time
          readOnly: true
        lastSyncStatus:
          type: string
          readOnly: true
        lastSyncError:
          type: string
          readOnly: true
    SyncLog:
      type: object
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [pull, push]
        source:
          type: string
          enum: [gongfeng, tapd]
        action:
          type: string
        status:
          type: string
          enum: [success, failed]
        count:
          type: integer
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    ScheduleJob:
      type: object
      required: [name]
      properties:
        sharedTaskId: {type: string, description: Published shared AI task id; requires skipDispatch=true and a pinned version}
        sharedTaskVersion: {type: integer, minimum: 1, description: Explicit immutable version; changing it is a manual upgrade}
        parameterValues: {type: object, additionalProperties: {type: string}, description: Project-local parameter values; validated against the pinned version}
        notifications: {type: array, maxItems: 3, items: {$ref: "#/components/schemas/NotificationBinding"}, description: Optional Bot notifications for execution success/failure}
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        projectId:
          type: string
        source:
          type: string
          enum: [gongfeng, tapd]
          description: Compatibility field; jobs no longer pull TAPD/Gongfeng themselves.
        tapdWorkspaceId:
          type: string
        tapdIterationId:
          type: string
        workflowId:
          type: string
          description: Required for trigger jobs. Ignored when skipDispatch is true.
        useIssueWorkflow:
          type: boolean
          description: When true, prefer the issue's bound LOOP and fall back to workflowId.
        skipDispatch:
          type: boolean
          description: "When true, this is an AI scheduled job: run assistantPrompt only. When false, this is a trigger job that scans issues and dispatches LOOP. The two kinds are exclusive."
        intervalSec:
          type: integer
          minimum: 0
          description: Used when cron is empty. Common values are 300, 900, 3600, 86400.
        cron:
          type: string
          description: Optional 5-field cron (minute hour day month weekday) in Asia/Shanghai. When set, intervalSec is ignored.
        assistantPrompt:
          type: string
          description: User-written prompt executed at schedule time. Required for independent AI jobs. Subscriptions resolve their pinned shared version. Cleared on trigger jobs.
        assistantModel:
          type: string
          description: Model id from GET /api/assistant/models?schedule=1.
        timeoutMinutes:
          type: integer
          minimum: 0
          maximum: 240
          default: 30
          description: AI jobs only. Minutes allowed for each execution, including tool calls and waits. Omitted or 0 uses 30. Expiry stops the AI turn and records a failed execution. Dispatched LOOPs continue independently.
        ownerUserId:
          type: integer
          format: int64
          description: Project owner recorded for jobs saved without a run-as identity.
        runAsUserId:
          type: integer
          format: int64
          readOnly: true
          description: User bound by the server to the last saver. Codex and Claude Code use configured account login on their online default personal Runner. Other configurations and offline Runners use the saver's personal API Key. CodeBuddy can use the shared key for allowed models if the personal key is missing. A bound user must retain write access to the project. Zero uses legacy owner selection.
        runAsName:
          type: string
          readOnly: true
          description: Display name of runAsUserId.
        sessionMode:
          type: string
          enum: ["", fixed]
          description: AI jobs only. Empty opens a new Studio conversation per execution; "fixed" keeps continuing one pinned conversation (fixedSessionId, server-managed).
        sessionKeep:
          type: integer
          enum: [10, 50, 100, -1]
          description: AI jobs that open a conversation per execution keep only their newest sessionKeep conversations; older ones are deleted after each execution (the execution records stay). -1 keeps all. Omitted or 0 saves the default 50; other values are rejected with 400. Ignored in fixed mode.
        lastRunAt:
          type: string
          format: date-time
          readOnly: true
        lastStatus:
          type: string
          enum: [running, success, failed, waiting]
          description: running means this instance is still executing the job (closing Studio does not cancel it).
          readOnly: true
        lastError:
          type: string
          readOnly: true
        lastPulled:
          type: integer
          description: Candidate issues scanned in the project
          readOnly: true
        lastDispatched:
          type: integer
          readOnly: true
        lastAssistantMessage:
          type: string
          readOnly: true
        lastTraceId:
          type: string
          description: Trace ID of the latest execution; matches ScheduleJobExecution.traceId and the scheduler log lines.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ScheduleExecutionWindow:
      type: object
      description: Executions started in one window. total = finished + running; avgMs averages finished executions with a duration.
      properties:
        total: { type: integer }
        finished: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        running: { type: integer }
        avgMs: { type: integer, format: int64 }
        metered:
          type: integer
          description: Finished executions that reported usage; missing usage is not counted as zero.
        tokens:
          type: object
          description: Sum of each execution's reported total (or input plus output); cache details are not added again.
          properties:
            total: { type: integer, format: int64 }
            input: { type: integer, format: int64 }
            output: { type: integer, format: int64 }
            cacheRead: { type: integer, format: int64 }
            cacheWrite: { type: integer, format: int64 }
        avgTokens: { type: integer, format: int64, description: Average tokens over metered executions only. }
        priced: { type: integer, description: Executions whose cost could be estimated. }
        costCny: { type: number, format: double, description: Sum of estimated costs in CNY. }
    ScheduleJobExecution:
      type: object
      description: One execution of a schedule job. Each job keeps its latest 200 executions.
      properties:
        id:
          type: string
        jobId:
          type: string
        jobName:
          type: string
        jobKind:
          type: string
          enum: [assistant, trigger]
        projectId:
          type: string
        traceId:
          type: string
          description: 32-hex trace ID, also written to every scheduler log line of this execution.
        triggerOrigin:
          type: string
          enum: [timer, manual_run]
        status:
          type: string
          enum: [running, success, failed, waiting]
        error:
          type: string
        pulled:
          type: integer
        dispatched:
          type: integer
        assistantMessage:
          type: string
        model:
          type: string
          description: Model used by this execution's AI generation.
        usage:
          $ref: "#/components/schemas/TokenUsage"
          description: Optional usage for this execution including retries and usage before failure, excluding prior turns and downstream LOOPs. Absence means unreported.
        costCny:
          type: number
          format: double
          description: Optional estimated cost in CNY, only present when pricing is known.
        sessionId:
          type: string
          description: Studio conversation an AI execution ran in.
        sessionGone:
          type: boolean
          description: Computed on each read, never stored. True when sessionId names a conversation that no longer exists (trimmed by the job's sessionKeep or the retention period, or deleted by hand). Running executions are never marked.
        runs:
          type: array
          items:
            type: object
            properties:
              issueId:
                type: string
              issueTitle:
                type: string
              runId:
                type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
    WorkflowMetrics:
      type: object
      additionalProperties: true
      properties:
        workflowId:
          type: string
        totalRuns:
          type: integer
        activeRuns:
          type: integer
        waitingRuns:
          type: integer
        succeededRuns:
          type: integer
        failedRuns:
          type: integer
        closureRate:
          type: number
        successRate:
          type: number
        averageDurationMs:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
    AnalyticsCostSummary:
      type: object
      additionalProperties: true
      description: 'Operational summary. Costs are public standard token estimates except HY reported charges; raw billing facts are unchanged. All analytics breakdowns, trends, traces and delivery rows additionally expose costCny; legacy costUsd fields are USD equivalents of the CNY statistic.'
      properties:
        costCurrency: {type: string, const: CNY}
        usdToCny: {type: number, const: 7}
        costPricingVersion: {type: string}
        totalCostCny: {type: number}
        costReportedCny: {type: number, description: 'Recognized amount, including recognized parts of incompletely priced runs'}
        costCoveragePct: {type: number}
        costUnknownRuns: {type: integer}
    AnalyticsDeliveryMR:
      type: object
      additionalProperties: true
      properties:
        project: {type: string}
        iid: {type: integer}
        url: {type: string}

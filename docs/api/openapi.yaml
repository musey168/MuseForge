            $ref: "#/components/schemas/Issue"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
    Issue:
      type: object
      required: [projectId, title]
      properties:
        closureAllowed:
          type: boolean
          readOnly: true
          description: Whether manual closure is permitted; active clarification, tasks or runs prevent closure.
        completedAt:
          type: string
          format: date-time
          readOnly: true
          description: Observed transition to a completed state. Preserved on edits and tracker polling, cleared on reopen; historical unknown timestamps remain unknown.
        deletionAllowed:
          type: boolean
          readOnly: true
          description: Whether deletion is currently permitted, computed from complete task and run history on list and detail responses.
        deletionBlock:
          type: object
          readOnly: true
          description: Present when deletion is blocked. Uses complete execution history; clarification and unfinished work take precedence over historical success and completed issue status. The DELETE conflict response uses the same reason.
          required: [code, reason]
          properties:
            code:
              type: string
              enum: [clarifying, active, succeeded, completed]
            reason:
              type: string
              description: Human-readable explanation suitable for direct display.
            runId:
              type: string
              description: Existing run responsible for the restriction, including legacy task-linked runs outside the current run list.
            taskId:
              type: string
              description: Task responsible for the restriction when there is no corresponding blocking run.
        id:
          type: string
        projectId:
          type: string
        number:
          type: integer
          readOnly: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done, blocked, cancelled, closed]
        priority:
          type: string
        assigneeType:
          type: string
          enum: [member, agent]
        assigneeId:
          type: string
        assigneeUserId:
          type: integer
          format: int64
        workflowId:
          type: string
          description: LOOP to deliver the requirement with; empty binds the project default LOOP. To deliver without any LOOP, set sopMode to none instead.
        sopMode:
          type: string
          enum: ["", none, sop]
          description: none delivers the requirement without a LOOP (clarified and changed in conversations; scheduled LOOPs never claim it) and clears workflowId. sop removes that opt-out, so workflowId or the project default applies again and scheduled LOOPs may claim it (an automationState sent in the same save still wins). Empty or omitted keeps the stored mode on edits.
        repositoryId:
          type: string
        baseBranch:
          type: string
          description: Existing work branch to continue directly for a single repository; empty creates a new work branch from the configured main branch; an omitted field preserves the selection on edits
        repositoryIds:
          type: array
          items: {type: string}
        repositoryBranches:
          type: object
          additionalProperties: {type: string}
          description: Existing work branches keyed by bound repository ID; overrides baseBranch. Empty or unlisted branches create new branches. Omitted preserves selections for retained repositories on edits; an empty object clears all selections.
        latestTaskId:
          type: string
        automationState:
          type: string
        deliveryState:
          type: string
        deliveryMrUrl:
          type: string
        deliveryMrState:
          type: string
          description: 所有交付 MR 的聚合状态（merged / integrated / opened / closed / unknown）

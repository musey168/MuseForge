openapi: 3.1.0
info:
  title: LoopForge Platform REST API
  version: 1.0.0
  description: |
    Public control-plane API exposed by LoopForge. Signed login cookies and
    user-owned Bearer tokens authenticate Studio, REST API, and MCP access. Legacy
    deployment-level Basic authentication remains available. Worker signals,
    OTLP ingestion, run leases, and sandbox-reclamation endpoints are intentionally
    excluded because they are internal implementation contracts.
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
  - basicAuth: []
tags:
  - name: System
  - name: Assistant
  - name: Projects
  - name: BusinessDomains
  - name: Repositories
  - name: Issues
  - name: Tasks
  - name: Assets
  - name: Workflows
  - name: Runs
  - name: Sync
  - name: Scheduling
  - name: Analytics
  - name: Feedback
  - name: Evolution
paths:
  /api/account:
    post:
      tags: [Personal]
      operationId: post_api_account
      summary: "Record the platform's single account"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/auth/github:
    get:
      tags: [Personal]
      operationId: get_api_auth_github
      summary: "GET /api/auth/github"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/auth/github/config:
    put:
      tags: [Personal]
      operationId: put_api_auth_github_config
      summary: "PUT /api/auth/github/config"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/auth/github/device:
    post:
      tags: [Personal]
      operationId: post_api_auth_github_device
      summary: "POST /api/auth/github/device"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/auth/github/poll:
    post:
      tags: [Personal]
      operationId: post_api_auth_github_poll
      summary: "POST /api/auth/github/poll"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/auth/github/repositories:
    get:
      tags: [Personal]
      operationId: get_api_auth_github_repositories
      summary: "GET /api/auth/github/repositories"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/bootstrap:
    get:
      tags: [System]
      operationId: getBootstrap
      summary: Load the complete Studio bootstrap catalog
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: List public REST and MCP operations
      responses:
        "200":
          description: Public operation manifest and MCP transports
          content:
            application/json:
              schema:
                type: object
                required: [operations, mcp]
                properties:
                  operations:
                    type: array
                    items:
                      type: object
                      required: [name, description, method, path, readOnly]
                      properties:
                        name: {type: string}
                        description: {type: string}
                        method: {type: string}
                        path: {type: string}
                        readOnly: {type: boolean}
                  mcp:
                    type: object
                    properties:
                      streamableHttp: {type: string}
                      stdioCommand: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/executor-models:
    get:
      tags: [Assets]
      operationId: listExecutorModels
      description: Returns, per built-in CLI, the selectable model IDs, the default model and the reasoning-effort levels. An Agent's model should be one of these IDs. `configured` reports whether a LOOP run can use the CLI for the caller, and `personal` whether the caller saved their own key for it.
      parameters:
        - name: projectId
          in: query
          schema: {type: string}
          description: Resolve `configured` against the execution machine a LOOP in this project uses, which is the caller's project default before the personal default. Omit it for personal LOOPs.
      responses:
        "200":
          description: Model catalog keyed by CLI id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenObject"
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/insights/v1/sources:
    get:
      tags: [Usage]
      operationId: get_api_insights_v1_sources
      summary: "List the reporting sources of a project"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
    post:
      tags: [Usage]
      operationId: post_api_insights_v1_sources
      summary: "Create a reporting source for a project and return its token once"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/insights/v1/sources/{id}:
    delete:
      tags: [Usage]
      operationId: delete_api_insights_v1_sources_id
      summary: "Revoke a reporting source"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/issues:
    get:
      tags: [Issues]
      operationId: listIssues
      parameters:
        - name: projectId
          in: query
          required: false
          schema: {type: string}
          description: When set, only issues belonging to this project are returned.
        - name: status
          in: query
          required: false
          schema: {type: string}
          description: Filter by issue status. Comma-separated values are OR-matched.
        - name: source
          in: query
          required: false
          schema: {type: string}
          description: Filter by source (local, gongfeng, tapd). Comma-separated values are OR-matched.
        - name: q
          in: query
          required: false
          schema: {type: string}
          description: Case-insensitive match against title, id, number, or external id.
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200}
          description: When omitted, the response is Issue[]. When set, the response is a page object and limit is capped at 200.
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: Issue list, or a page when limit is set
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                  - $ref: "#/components/schemas/IssueListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Issues]
      operationId: createIssue
      requestBody:
        $ref: "#/components/requestBodies/Issue"
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Issues]
      operationId: upsertIssue
      requestBody:
        $ref: "#/components/requestBodies/Issue"
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      tags: [Issues]
      operationId: getIssue
      responses:
        "200":
          description: Issue and comments
          content:
            application/json:
              schema:
                type: object
                required: [issue, comments]
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/IssueComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Issues]
      operationId: deleteIssue
      summary: Delete a local requirement
      description: Deletes the issue, clarification, comments and failed/cancelled tasks, runs, logs, artifacts, previews and execution environments. Successful or active executions prevent deletion. The external tracker record is retained and sync may import the issue again.
      responses:
        "204":
          description: Local issue deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Issue has successful execution history or is clarifying or executing a LOOP
  /api/issues/{id}/close:
    post:
      tags: [Requirements]
      operationId: post_api_issues_id_close
      summary: "Close a requirement"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: createIssueComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueComment"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/issues/{id}/images/{imageId}:
    get:
      tags: [Requirements]
      operationId: get_api_issues_id_images_imageId
      summary: "GET /api/issues/{id}/images/{imageId}"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/issues/{issueId}/reopen:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: reopenIssue
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/issues/{id}/requirement:
    get:
      tags: [Requirements]
      operationId: get_api_issues_id_requirement
      summary: "GET /api/issues/{id}/requirement"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/model-catalog:
    get:
      tags: [Models]
      operationId: get_api_model_catalog
      summary: "Get the personal model catalogue: the CLIs the account may run with and the models each offers"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/observability/spec:
    get:
      tags: [Analytics]
      operationId: getObservabilitySpec
      responses:
        "200":
          description: Public observability vocabulary and adapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPI
      summary: Read this OpenAPI 3.1 contract
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        $ref: "#/components/requestBodies/Project"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Projects]
      operationId: upsertProject
      description: When replacing members of an existing project, send membersVersion from the last project read. Omit members to preserve the current roster.
      requestBody:
        $ref: "#/components/requestBodies/Project"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The member list has changed or membersVersion is missing. Reload the project before retrying.
  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      operationId: deleteProject
      description: >-
        Delete (archive) a project; owner or platform admin. The project leaves
        project lists and syncs, its requirements, runs and settings are kept
        and the id stays taken. 409 while it has unfinished runs or enabled
        schedule jobs.
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/projects/{projectId}/restore:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Projects]
      operationId: restoreProject
      description: Restore a deleted project; owner or platform admin.
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/repositories:
    get:
      tags: [Repositories]
      operationId: listRepositories
      responses:
        "200":
          description: Repository list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Repositories]
      operationId: createRepository
      requestBody:
        $ref: "#/components/requestBodies/Repository"
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Repositories]
      operationId: upsertRepository
      requestBody:
        $ref: "#/components/requestBodies/Repository"
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Repositories]
      operationId: deleteRepository
      parameters:
        - $ref: "#/components/parameters/RepositoryIdQuery"
      responses:
        "200":
          $ref: "#/components/responses/Status"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/repositories/{repositoryId}:
    parameters:
      - name: repositoryId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Repositories]
      operationId: getRepository
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runners:
    get:
      tags: [Machines]
      operationId: get_api_runners
      summary: "List the registered machines: their operating system, their CLIs, each CLI's version and login mode, and when "
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/bind-codes:
    post:
      tags: [Machines]
      operationId: post_api_runners_bind_codes
      summary: "POST /api/runners/bind-codes"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/deregister:
    post:
      tags: [Machines]
      operationId: post_api_runners_deregister
      summary: "POST /api/runners/deregister"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/disconnect:
    post:
      tags: [Machines]
      operationId: post_api_runners_disconnect
      summary: "POST /api/runners/disconnect"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/heartbeat:
    post:
      tags: [Machines]
      operationId: post_api_runners_heartbeat
      summary: "POST /api/runners/heartbeat"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/register:
    post:
      tags: [Machines]
      operationId: post_api_runners_register
      summary: "POST /api/runners/register"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/runtimes:
    post:
      tags: [Machines]
      operationId: post_api_runners_runtimes
      summary: "POST /api/runners/runtimes"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
    put:
      tags: [Machines]
      operationId: put_api_runners_runtimes
      summary: "PUT /api/runners/runtimes"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/{id}:
    delete:
      tags: [Machines]
      operationId: delete_api_runners_id
      summary: "DELETE /api/runners/{id}"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/{id}/maintenance:
    get:
      tags: [Machines]
      operationId: get_api_runners_id_maintenance
      summary: "Read a machine's CLI maintenance state"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
    post:
      tags: [Machines]
      operationId: post_api_runners_id_maintenance
      summary: "Update or roll back a machine's CLI"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/{id}/models:
    put:
      tags: [Machines]
      operationId: put_api_runners_id_models
      summary: "PUT /api/runners/{id}/models"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/runners/{id}/models/probe:
    post:
      tags: [Machines]
      operationId: post_api_runners_id_models_probe
      summary: "Probe the models a machine's CLI can reach"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/tracker/import:
    get:
      tags: [Tracker]
      operationId: get_api_tracker_import
      summary: "Read the tracker import's last run and its outcome"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
    post:
      tags: [Tracker]
      operationId: post_api_tracker_import
      summary: "Import the open issues of every bound GitHub or GitLab repository"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/usage:
    get:
      tags: [Analytics]
      operationId: getUsage
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: grain
          in: query
          schema:
            type: string
            enum: [day, week, month]
        - name: tz
          in: query
          schema:
            type: string
        - name: bucket
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The usage console of the externally reported executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageConsole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/{id}:
    get:
      tags: [Personal]
      operationId: get_api_users_id
      summary: "GET /api/users/{id}"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
    post:
      tags: [Personal]
      operationId: post_api_users_id
      summary: "POST /api/users/{id}"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/users/{id}/cli-models/probe:
    post:
      tags: [Personal]
      operationId: post_api_users_id_cli_models_probe
      summary: "POST /api/users/{id}/cli-models/probe"
      responses:
        "200":
          description: OK
        "400":
          description: The request is malformed
        "404":
          description: The resource does not exist
  /api/users/{id}/credentials:
    put:
      tags: [Users]
      operationId: updateOwnCredentials
      summary: Update model credentials for the current authenticated user
      description: Git access tokens are managed through /api/users/{id}/git-http-credentials.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assistantDefaults:
                  $ref: "#/components/schemas/AssistantDefaults"
                codeBuddyApiKey: {type: string, writeOnly: true}
                codeBuddyApiKeyClear: {type: boolean}
                codeBuddyBaseUrl: {type: string, description: "HTTP(S) CodeBuddy gateway base URL. Omitted preserves the value; empty uses the official endpoint for the selected edition."}
                codeBuddyInternetEnvironment: {type: string, description: "Edition that issued the CodeBuddy key: empty for International, \"internal\" for China, \"ioa\" for iOA (\"public\" and \"China\" are also accepted). Any other value is rejected with 400."}
                codexApiKey: {type: string, writeOnly: true, description: "Blank preserves the stored key."}
                codexApiKeyClear: {type: boolean}

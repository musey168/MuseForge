            type: object
            properties:
              repositoryId:
                type: string
              repository:
                type: string
              project:
                type: string
              iid:
                type: integer
              url:
                type: string
              state:
                type: string
              targetBranch:
                type: string
        deliveryUpdatedAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [requirement, issue]
        clarification:
          $ref: "#/components/schemas/ClarificationAssessment"
        source:

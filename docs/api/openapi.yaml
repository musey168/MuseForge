        models:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        executions:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        empty:
          type: boolean
        timeZone:
          type: string
        grain:
          type: string

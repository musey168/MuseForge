components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: agentflow_user
    basicAuth:
      type: http
      scheme: basic
  parameters:
    SkillhubSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    SkillhubNamespace:
      name: namespace
      in: query
      description: SkillHub publisher handle; slugs are only unique within a namespace
      schema:
        type: string
    SkillhubVersion:
      name: version
      in: query
      description: Defaults to the latest version
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    AssetIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    RepositoryIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    NodeIdQuery:
      name: nodeId
      in: query
      schema:
        type: string
    After:
      name: after
      in: query
      schema:
        type: integer
        format: int64
    Before:
      name: before
      in: query
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
  requestBodies:
    Project:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Project"
              - type: object
                properties:
                  tapdClear:
                    type: boolean
    Repository:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryInput"
    Issue:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Issue"
              - type: object
                properties:
                  syncTarget:
                    type: string
                    enum: [gongfeng, tapd]
    ChatClarify:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChatClarifyRequest"
    Agent:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentDefinition"
    RuleAsset:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuleAsset"
    SkillAsset:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillAsset"
    MCPServerAsset:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MCPServerAsset"
    SandboxProfile:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxProfile"
    Workflow:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowDefinition"
    NodeAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nodeId]
            properties:
              nodeId:
                type: string
    SyncConfig:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncConfig"
    ScheduleJob:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleJob"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Basic authentication required
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation is disabled or forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SkillhubUnavailable:
      description: SkillHub rejected the package (422), rate limited (429), is unavailable (502) or timed out (504)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Upstream analysis timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Ok:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"
    Status:
      description: Status result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    Project:
      description: Project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Project"
    ProjectJoinRequest:
      description: Project join request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectJoinRequest"
    ProjectList:
      description: Project list
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Project"
    Repository:
      description: Repository
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Repository"
    Issue:
      description: Issue
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Issue"
    Workflow:
      description: Workflow definition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowDefinition"
    WorkflowList:
      description: Workflow definitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/WorkflowDefinition"
    Run:
      description: Run
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Run"
    RunList:
      description: Run summaries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Run"
    RevisionList:
      description: Definition revisions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DefinitionRevision"
    AssetList:
      description: Asset definitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpenObject"
    ClarifyResult:
      description: JSON clarification result or SSE event stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClarifyResult"
        text/event-stream:
          schema:
            type: string
    SyncConfig:
      description: Sync configuration
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncConfig"
    ScheduleJob:
      description: Schedule job
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleJob"
    ScheduleJobList:
      description: Schedule jobs
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ScheduleJob"
  schemas:
    NotificationBotInput:
      type: object
      required: [name, botId]
      properties:
        projectId: {type: string}
        name: {type: string, maxLength: 80}
        channel: {type: string, enum: [wecom, feishu, dingtalk]}
        botId: {type: string, description: "WeCom Bot ID, Feishu App ID or DingTalk Client ID", maxLength: 191}
        secret: {type: string, description: "Empty keeps the stored secret", maxLength: 512}
        enabled: {type: boolean}
        interactionEnabled: {type: boolean}
        model: {type: string}
        writeApproval: {type: string, enum: [readonly, auto], description: "auto is WeCom only"}
        targetId: {type: string, description: "WeCom notification target"}
        configVersion: {type: integer, description: "Expected version for updates"}
        tenantKey: {type: string, maxLength: 191, description: "DingTalk enterprise CorpId; required on create, changeable until the enterprise is locked"}
    BotManualAction:
      type: object
      required: [actionKey]
      properties:
        actionKey: {type: string, maxLength: 64, description: "Client-generated key; a repeated key returns the same result"}
        reason: {type: string, maxLength: 60}
    AssistantDefaults:
      type: object
      properties:
        executor: {type: string, description: A configured personal executor.}
        model: {type: string, description: Concrete model ID on the executor.}
        effort: {type: string, description: The selected model's reasoning effort.}
        approval: {type: string, enum: [confirm, assisted, auto], description: Initial confirmation mode for new conversations.}
    OpenObject:
      type: object
      additionalProperties: true
    RuleAsset:
      type: object
      required: [id, name, content]
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        projectId: {type: string, description: Owning project}
        shared: {type: boolean, description: Visible to every project}
        description: {type: string}
        content: {type: string, description: Rule text injected into bound roles}
        priority: {type: integer}
        global: {type: boolean, description: Apply to every node of the workflows in workflowIds}
        workflowIds: {type: array, items: {type: string}}
    SkillAsset:
      type: object
      required: [id, name, content]
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        projectId: {type: string}
        shared: {type: boolean}
        description: {type: string}
        content: {type: string, description: SKILL.md body}
        files: {type: object, additionalProperties: {type: string}, description: Extra text files keyed by relative path}
    MCPServerAsset:
      type: object
      required: [id, name, transport]
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        projectId: {type: string}
        scope: {type: string, enum: [project, personal]}
        description: {type: string}
        transport: {type: string, enum: [stdio, http]}
        command: {type: string, description: stdio executable}
        args: {type: array, items: {type: string}}
        url: {type: string, description: http endpoint}
        environment: {type: object, additionalProperties: {type: string}}
        headers: {type: object, additionalProperties: {type: string}}
        installScript: {type: string}
        workingDirectory: {type: string}
        pathEntries: {type: array, items: {type: string}}
        authType: {type: string, enum: ["", github-token]}
        timeoutSec: {type: integer}
    SandboxProfile:
      type: object
      required: [id, name, projectId, driver]
      additionalProperties: true
      description: >-
        Execution environment for LOOP runs and conversation workspaces; the built-in shared
        generic-docker profile is the default. driver=native runs on whichever execution machine,
        cloud runner or platform host executes the work, with that machine's own toolchains; its
        repositories are shared clones of that machine's repository cache. A stored local profile
        reads as native.
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string, description: Free-form notes shown in the sandbox catalog; not sent to execution machines}
        toolchain: {type: string, description: Tool and version hints used when an Agent chooses a sandbox}
        projectId: {type: string, description: Owning project (required)}
        shared: {type: boolean, description: Visible to every project}
        driver: {type: string, enum: [native, docker]}
        dockerfile:
          type: object
          description: "driver=docker (required): the image recipe, stored with the sandbox. Ignored for other drivers."
          required: [content]
          properties:
            content: {type: string, description: Dockerfile text}
            files: {type: object, additionalProperties: {type: string}, description: Build-context files keyed by relative path}
        readOnlyRootFS: {type: boolean, description: "driver=docker only"}
        privileged: {type: boolean, default: false, description: "Docker only. Requests privileged workspace containers on an execution host that allows them."}
        cpuMillicores: {type: integer, format: int64, minimum: 0, maximum: 9223372036854, description: "Docker CPU limit in millicores. 1000 is one CPU, 0 or omitted inherits machine settings, and the minimum configured limit is 10."}
        memoryMiB: {type: integer, format: int64, minimum: 0, maximum: 8796093022207, description: "Docker memory limit in MiB. 0 or omitted inherits machine settings, and the minimum configured limit is 6."}
        environment: {type: object, additionalProperties: {type: string}, description: Variables added to every command; a native sandbox keeps the execution machine's PATH unless this sets one}
    APIToken:
      type: object
      required: [id, userId, name, prefix, createdAt]
      properties:
        id: {type: string}
        userId: {type: integer, format: int64}
        name: {type: string}
        prefix: {type: string, description: Non-secret display prefix}
        lastUsedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BusinessDomain:
      type: object
      required: [id, name, active, managerIds, viewerIds]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$', description: 'Stable ID; all and unclassified are reserved'}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        active: {type: boolean}
        managerIds: {type: array, uniqueItems: true, items: {type: integer, format: int64}}
        viewerIds: {type: array, uniqueItems: true, items: {type: integer, format: int64}}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    BusinessDomainAssignment:
      type: object
      properties:
        id: {type: integer, format: int64}
        projectId: {type: string}
        fromDomainId: {type: string}
        toDomainId: {type: string}
        actorId: {type: integer, format: int64}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    BusinessDomainReport:
      type: object
      properties:
        attribution: {type: string, const: current}
        generatedAt: {type: string, format: date-time}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        summary: {$ref: "#/components/schemas/AnalyticsCostSummary"}
        delivery: {type: object, description: 'Existing AnalyticsDeliverySummary'}
        trend: {type: array, items: {type: object}}
        projects: {type: array, items: {type: object}, description: 'Project ID, name, businessDomainId and AnalyticsProjectUsage'}
        businessDomains: {type: array, items: {type: object}, description: 'ID, name, active, projectCount, runs, success, failed, tokens, costCny, legacy USD equivalent costUsd, costKnown, uniqueIssues and delivered'}
        deliveryMetrics: {$ref: "#/components/schemas/BusinessDeliveryMetrics"}
        deliveryTrend:
          type: array
          items:
            type: object
            properties:
              date: {type: string, description: 'Day, ISO week or month in the reporting timezone'}
              completedIssues: {type: integer}
              mergedMrs: {type: integer}
              cycleSamples: {type: integer}
              averageCycleDurationMs: {type: integer, format: int64}
              executionSamples: {type: integer}
              averageExecutionDurationMs: {type: integer, format: int64, description: Average completion duration excluding waits; requires executionSamples greater than zero}
        timeZone: {type: string}
        grain: {type: string, enum: [day, week, month]}
    BusinessDeliveryMetrics:
      type: object
      description: 'Also included as deliveryMetrics on each project and business domain. Completion, merge and Run creation windows are independent. No individual issue or Run details are returned.'
      properties:
        completionToMergeSamples: {type: integer, description: 'One sample per unique repository and MR IID, filtered by its own merge time'}
        averageCompletionToMergeMs: {type: integer, format: int64, description: 'Mean of the latest matched successful completion to each individual MR actual merge; multiple MRs for one issue are separate samples'}
        completionToMergeMissingIssues: {type: integer, description: 'Merged items without matched completion events or complete delivery MR evidence'}
        completionToMergeMissingMrs: {type: integer, description: 'Merged MRs missing completion events or matching delivery evidence'}
        mergedBeforeCompletionMrs: {type: integer, description: 'MRs merged before matching flow completion, excluded from latency averages'}
        mergedBeforeCompletionIssues: {type: integer, description: 'Items merged before their flow finished; excluded from the latency average'}
        completedIssues: {type: integer, description: 'Current done/closed/completed work items whose completion time falls in the requested window; includes Issues'}
        mergedMrs: {type: integer, description: 'Unique work MRs by actual merged_at, including integration branches, excluding baseline promotion MRs'}
        mergedMrsMissingTime: {type: integer, description: 'Merged MRs in scope with no merge timestamp, excluded from dated counts'}
        completionTimeMissingIssues: {type: integer, description: 'Currently completed historical items with no usable time, excluded from dated completion counts'}
        estimatedCompletionIssues: {type: integer, description: 'Included historical items whose time is inferred from their latest successful top-level Run'}
        cycleSamples: {type: integer}
        averageCycleDurationMs: {type: integer, format: int64, description: Completion elapsed time including waits; averaged over cycleSamples}
        executionSamples: {type: integer, description: Completed items with node execution events for every related attempt and child LOOP}
        averageExecutionDurationMs: {type: integer, format: int64, description: Union of actual node execution intervals per item; excludes waits and double counting of parallel or nested execution; averaged over executionSamples}
        p50CycleDurationMs: {type: integer, format: int64, deprecated: true}
        p95CycleDurationMs: {type: integer, format: int64, deprecated: true, description: 'Nearest-rank percentile over individual work items, never an average of project percentiles'}
        completedTokens: {type: integer, format: int64}
        averageTokensPerCompletedIssue: {type: integer, format: int64}
        latestCompletedAt: {type: string, format: date-time}
    Project:
      type: object
      required: [id, name]
      properties:
        businessDomainId:
          type: string
          readOnly: true
          description: Current main business domain. Use the dedicated assignment endpoint to change it.
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        workflowId:
          type: string
        defaultRepositoryId:
          type: string
        ownerId:
          type: integer
          format: int64
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        membersVersion:
          type: string
          description: Opaque membership snapshot token. Required when replacing members of an existing project; stale tokens return 409.
        tapdWorkspaceId:
          type: string
        tapdIterationId:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ProjectMember:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum: [maintainer, member, viewer]
    ProjectJoinRequest:
      type: object
      required: [id, projectId, userId, role, status]
      properties:
        id: {type: integer, format: int64}
        projectId: {type: string}
        userId: {type: integer, format: int64}
        role:
          type: string
          enum: [maintainer, member, viewer]
          description: Requested role while pending, granted role once approved.
        reason: {type: string}
        status: {type: string, enum: [pending, approved, rejected, withdrawn]}
        reviewerId: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        reviewedAt: {type: string, format: date-time}
    PlatformAccount:
      type: object
      properties:
        userId: {type: integer, format: int64}
        loginName: {type: string}
        chineseName: {type: string}
        admin: {type: boolean}
        password: {type: boolean, description: False for accounts that sign in through GitHub or a gateway}
        codeBuddyApiKeyConfigured: {type: boolean}
        createdAt: {type: string, format: date-time}
    PlatformGitSSHHost:
      type: object
      required: [host, publicKeys]
      properties:
        host: {type: string, example: "git.example.org:2222"}
        publicKeys: {type: string, description: One OpenSSH public key per line.}
        fingerprints:
          type: array
          readOnly: true

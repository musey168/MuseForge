name: loopforge
services:
  mysql:
    # MySQL stays supported next to SQLite. It is opt-in: start it with the
    # "mysql" profile (docker compose --profile mysql up).
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: loopforge
      MYSQL_USER: loopforge
      MYSQL_PASSWORD: ${LOOPFORGE_DB_PASSWORD:?Run scripts/configure.sh first}
      MYSQL_ROOT_PASSWORD: ${LOOPFORGE_DB_ROOT_PASSWORD:?Run scripts/configure.sh first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${LOOPFORGE_MYSQL_PORT:-33315}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u loopforge --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  platform:
    profiles: [platform]
    # The platform is this checkout: the image is built from the repository.
    # LOOPFORGE_IMAGE names a tag for an installation that published its own.
    image: ${LOOPFORGE_IMAGE:-museforge-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOOPFORGE_BUILD_JOBS: ${LOOPFORGE_BUILD_JOBS:-}
        LOOPFORGE_COMMIT: ${LOOPFORGE_COMMIT:-}
    ports:
      - "${LOOPFORGE_BIND:-127.0.0.1}:${AGENTFLOW_HTTP_PORT:-8090}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENTFLOW_HTTP_PORT: 8080
      # Inside the container's own network namespace the wildcard reaches
      # nothing but the container; the published port bounds what the host
      # exposes, and it is published on the loopback interface.
      AGENTFLOW_ALLOW_PUBLIC_BIND: "1"
      # The datasource: one SQLite file by default, no database server needed.
      # An empty value falls back to AGENTFLOW_MYSQL_DSN (the MySQL profile).
      AGENTFLOW_DATASOURCE_DSN: ${AGENTFLOW_DATASOURCE_DSN:-}
      AGENTFLOW_MYSQL_DSN: loopforge:${LOOPFORGE_DB_PASSWORD}@tcp(mysql:3306)/loopforge
      AGENTFLOW_SESSION_SECRET: ${AGENTFLOW_SESSION_SECRET:?Run scripts/configure.sh first}
      AGENTFLOW_AUTH_REQUIRED: "false"
      AGENTFLOW_GITHUB_CLIENT_ID: ${AGENTFLOW_GITHUB_CLIENT_ID:-}
      AGENTFLOW_MCP_TOKEN: ${AGENTFLOW_MCP_TOKEN:-}
      AGENTFLOW_GIT_SSH_KNOWN_HOSTS: ${AGENTFLOW_GIT_SSH_KNOWN_HOSTS:-}
      AGENTFLOW_CREDENTIAL_KEYS: ${AGENTFLOW_CREDENTIAL_KEYS:-}
      HOME: ${LOOPFORGE_DATA_DIR:?Run scripts/configure.sh first}/home
      AGENTFLOW_RUNNER_BINARY: /app/bin/agentflow-runner-{os}-{arch}
    command: ["-addr", "0.0.0.0:8080"]
    volumes:
      - platform-data:/data
      - ${LOOPFORGE_DATA_DIR}:${LOOPFORGE_DATA_DIR}
    depends_on:
      # The database server is optional: without the "mysql" profile the
      # platform runs on its SQLite file and needs no server at all.
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
volumes:
  mysql-data:
  platform-data:

name: platform
on:
  pull_request:
  push:
    branches: [dev, stable, main, master]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: go build ./...
      - run: go vet ./...
      - name: Go tests
        run: go test ./internal/... ./cmd/... ./web/ -count=1 -timeout=900s
      - name: Browser-free console tests
        run: npm ci --no-audit --no-fund && npm test
        working-directory: webtest
      - name: Live-suite unit checks
        run: node --test 'unit/*.test.mjs'
        working-directory: e2e
      - name: The omp extension's tests
        run: node --test 'tests/*.test.mjs'
        working-directory: omp-extension
      - name: Live verification against a real platform
        run: ./verify-personal.sh
        working-directory: e2e
      - name: Public-surface check
        run: python3 scripts/check-public.py
      - name: Secret scan
        run: bash scripts/scan-secrets.sh
        env:
          LOOPFORGE_GITLEAKS_TOKEN: ${{ github.token }}
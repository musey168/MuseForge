name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Existing release tag to publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Verify release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref || github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${TAG} is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checkout does not match the release tag commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/dev; then
            echo "Release tag ${TAG} is not on dev" >&2
            exit 1
          fi
          ci="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow platform.yml --commit "${tag_commit}" \
            --json event,conclusion --jq '[.[] | select(.event == "push")][0].conclusion // ""')"
          if [[ "${ci}" != "success" ]]; then
            echo "The platform workflow has not succeeded on ${tag_commit} (status: ${ci:-not run})" >&2
            exit 1
          fi
          version="${TAG#v}"
          if ! grep -q "^## ${version} " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${version} ' section" >&2
            exit 1
          fi
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # The platform is this checkout; there is no image to pull, so the
          # release carries the install and upgrade steps and nothing else.
          notes="$(cat <<EOF
          ## Install

          \`\`\`bash
          git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git
          cd ${GITHUB_REPOSITORY#*/}
          ./start.sh
          \`\`\`

          The image is built from the checkout, one container starts on
          \`127.0.0.1:8090\`, and everything is kept in one SQLite file below the
          data directory. Open <http://127.0.0.1:8090> — there is no account and
          no sign-in.

          ## Upgrade

          Stop the platform, check out \`${TAG}\`, run \`./start.sh pull\`. The schema
          only gains the columns and tables it needs, so take the database backup
          described in \`docs/deployment.md\` first. Read the \`${TAG}\` section of
          [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)
          before starting it.
          EOF
          )"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it in place"
            exit 0
          fi
          release_args=(--title "MuseForge v${VERSION}" --notes "${notes}" --generate-notes --verify-tag)
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${TAG}" "${release_args[@]}"